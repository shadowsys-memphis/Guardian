<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Brain Guardian — AI Caregiving OS for Veteran Families</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Crawlable by search engines and AI crawlers -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_PUBLIC_SITE_URL%/guardian" />

    <!-- Description -->
    <meta name="description" content="AI-powered caregiving OS for families supporting Veterans with PTSD. Medication tracking, care routines, and AI clinical summaries. 14-day free trial — $19/mo." />

    <!-- Open Graph -->
    <meta property="og:title" content="Brain Guardian — AI Caregiving OS for Veteran Families" />
    <meta property="og:description" content="The first AI-powered caregiving operating system built for Veterans with complex care needs. Medication cycles, care routines, meal planning, and clinical summaries. Start free." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_PUBLIC_SITE_URL%/guardian" />
    <meta property="og:image" content="%VITE_PUBLIC_SITE_URL%/opengraph.jpg" />
    <meta property="og:site_name" content="Brain Guardian" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brain Guardian — AI Caregiving OS for Veteran Families" />
    <meta name="twitter:description" content="The first AI-powered caregiving OS for Veterans with complex care needs. Medication tracking, care routines, meal planning, and weekly clinical summaries. 14-day free trial." />
    <meta name="twitter:image" content="%VITE_PUBLIC_SITE_URL%/opengraph.jpg" />

    <!-- Structured Data: WebSite + Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "%VITE_PUBLIC_SITE_URL%/#website",
          "url": "%VITE_PUBLIC_SITE_URL%/",
          "name": "Brain Guardian",
          "description": "AI-powered caregiving OS for families supporting Veterans with PTSD and complex care needs.",
          "inLanguage": "en-US",
          "publisher": {
            "@id": "%VITE_PUBLIC_SITE_URL%/#organization"
          }
        },
        {
          "@type": "Organization",
          "@id": "%VITE_PUBLIC_SITE_URL%/#organization",
          "name": "Brain Guardian",
          "url": "%VITE_PUBLIC_SITE_URL%/",
          "logo": {
            "@type": "ImageObject",
            "url": "%VITE_PUBLIC_SITE_URL%/favicon.svg"
          },
          "sameAs": []
        }
      ]
    }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Brain Guardian",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "description": "AI-powered caregiving operating system for families supporting Veterans with PTSD and complex care needs. Includes medication cycle tracking, care routine management, meal planning, and AI-generated weekly clinical summaries.",
      "url": "%VITE_PUBLIC_SITE_URL%/guardian",
      "offers": [
        {
          "@type": "Offer",
          "name": "Family Plan",
          "price": "19.00",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "19.00",
            "priceCurrency": "USD",
            "unitCode": "MON"
          },
          "description": "1 care workspace, up to 5 family members, full AI care summaries, 14-day free trial."
        },
        {
          "@type": "Offer",
          "name": "Multi-Care Plan",
          "price": "39.00",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "39.00",
            "priceCurrency": "USD",
            "unitCode": "MON"
          },
          "description": "Up to 3 care workspaces, unlimited family members, priority AI processing, 14-day free trial."
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/guardian-main.tsx"></script>
  </body>
</html>
