kind = "web"
previewPath = "/"
title = "br(AI)n App"
version = "1.0.0"
id = "artifacts/brain-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23920

[services.development]
run = "pnpm --filter @workspace/brain-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brain-app", "run", "build" ]
publicDir = "artifacts/brain-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/guardian"
to = "/guardian.html"

[[services.production.rewrites]]
from = "/guardian/"
to = "/guardian.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23920"
BASE_PATH = "/"
