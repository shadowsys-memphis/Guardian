openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: br(AI)n App API - Caregiver AI System
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: schedule
    description: Daily schedule and tasks (Q1-Q4 quarters)
  - name: symptoms
    description: Symptom and motivation logging
  - name: scripts
    description: Voice script management for Jessica
  - name: state
    description: Live app state management
  - name: haldol
    description: Haldol cycle tracking
  - name: governor
    description: Raymo's Sovereign Staff Governor - personal productivity pillars
  - name: gemini
    description: Gemini AI chat and image operations
  - name: smarthome
    description: Smart home device controls (Alexa/Sonos)
  - name: intercom
    description: E2EE encrypted family intercom
  - name: health-assessment
    description: Jessica health assessment sessions, questions, and data points
  - name: shopper
    description: Weekly meal planning, grocery cart building, and Pops craving suggestions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /state:
    get:
      operationId: getAppState
      tags: [state]
      summary: Get current live app state (includes computed quarter from wall clock)
      responses:
        "200":
          description: Current app state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppState"
    put:
      operationId: updateAppState
      tags: [state]
      summary: Update live app state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppStateInput"
      responses:
        "200":
          description: Updated app state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppState"

  /schedule:
    get:
      operationId: getSchedule
      tags: [schedule]
      summary: Get full daily schedule with Q1-Q4 tasks
      responses:
        "200":
          description: Daily schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleTask"
    post:
      operationId: createScheduleTask
      tags: [schedule]
      summary: Create a new schedule task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleTaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleTask"

  /schedule/{id}:
    put:
      operationId: updateScheduleTask
      tags: [schedule]
      summary: Update a schedule task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleTaskInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleTask"
    delete:
      operationId: deleteScheduleTask
      tags: [schedule]
      summary: Delete a schedule task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /schedule/{id}/complete:
    post:
      operationId: completeScheduleTask
      tags: [schedule]
      summary: Mark a task as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleTask"

  /symptoms:
    get:
      operationId: getSymptomLogs
      tags: [symptoms]
      summary: Get symptom logs (most recent first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Symptom logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymptomLog"
    post:
      operationId: createSymptomLog
      tags: [symptoms]
      summary: Log a symptom/behavior observation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSymptomLogInput"
      responses:
        "201":
          description: Created symptom log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymptomLog"

  /scripts:
    get:
      operationId: getVoiceScripts
      tags: [scripts]
      summary: Get all voice scripts for Jessica
      responses:
        "200":
          description: Voice scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceScript"
    post:
      operationId: createVoiceScript
      tags: [scripts]
      summary: Create a new voice script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoiceScriptInput"
      responses:
        "201":
          description: Created script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceScript"

  /scripts/{id}:
    put:
      operationId: updateVoiceScript
      tags: [scripts]
      summary: Update (patch) a voice script - live real-time update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVoiceScriptInput"
      responses:
        "200":
          description: Updated script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceScript"
    delete:
      operationId: deleteVoiceScript
      tags: [scripts]
      summary: Delete a voice script
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /scripts/active:
    get:
      operationId: getActiveScripts
      tags: [scripts]
      summary: Get currently active scripts (for phone system)
      responses:
        "200":
          description: Active scripts for the phone system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceScript"

  /haldol:
    get:
      operationId: getHaldolCycle
      tags: [haldol]
      summary: Get current Haldol 14-day cycle status
      responses:
        "200":
          description: Haldol cycle info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaldolCycle"
    put:
      operationId: updateHaldolCycle
      tags: [haldol]
      summary: Update Haldol cycle (set injection date, notes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHaldolCycleInput"
      responses:
        "200":
          description: Updated cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaldolCycle"

  /governor/pillars:
    get:
      operationId: getGovernorPillars
      tags: [governor]
      summary: Get all Governor productivity pillars
      responses:
        "200":
          description: Governor pillars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernorPillar"

  /governor/notes:
    get:
      operationId: getGovernorNotes
      tags: [governor]
      summary: Get synthesis notes (most recent first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Governor notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernorNote"
    post:
      operationId: createGovernorNote
      tags: [governor]
      summary: Log a synthesis note for a pillar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGovernorNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernorNote"

  /gemini/conversations:
    get:
      operationId: listGeminiConversations
      tags: [gemini]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiConversation"
    post:
      operationId: createGeminiConversation
      tags: [gemini]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"
  /gemini/conversations/{id}:
    get:
      operationId: getGeminiConversation
      tags: [gemini]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    delete:
      operationId: deleteGeminiConversation
      tags: [gemini]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
  /gemini/conversations/{id}/messages:
    get:
      operationId: listGeminiMessages
      tags: [gemini]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiMessage"
    post:
      operationId: sendGeminiMessage
      tags: [gemini]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /smarthome/devices:
    get:
      operationId: getSmartHomeDevices
      tags: [smarthome]
      summary: Get all smart home devices and their state
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartHomeDevice"
  /smarthome/devices/{key}:
    put:
      operationId: updateSmartHomeDevice
      tags: [smarthome]
      summary: Update a device state
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSmartHomeDeviceInput"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartHomeDevice"

  /intercom/messages:
    get:
      operationId: getIntercomMessages
      tags: [intercom]
      summary: Get recent encrypted intercom messages
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Encrypted messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntercomMessage"
    post:
      operationId: postIntercomMessage
      tags: [intercom]
      summary: Post an encrypted message to the intercom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntercomMessageInput"
      responses:
        "201":
          description: Posted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntercomMessage"

  /health-assessment/questions:
    get:
      operationId: listHealthQuestions
      tags: [health-assessment]
      summary: List all health assessment questions
      responses:
        "200":
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthQuestion"
    post:
      operationId: createHealthQuestion
      tags: [health-assessment]
      summary: Create a new health question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHealthQuestionInput"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthQuestion"

  /health-assessment/questions/{id}:
    put:
      operationId: updateHealthQuestion
      tags: [health-assessment]
      summary: Update a health question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHealthQuestionInput"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthQuestion"
    delete:
      operationId: deleteHealthQuestion
      tags: [health-assessment]
      summary: Delete a health question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /health-assessment/sessions:
    get:
      operationId: listCallSessions
      tags: [health-assessment]
      summary: List call sessions (most recent first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallSession"
    post:
      operationId: startCallSession
      tags: [health-assessment]
      summary: Start a new call session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCallSessionInput"
      responses:
        "201":
          description: Started session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"

  /health-assessment/sessions/{id}/end:
    put:
      operationId: endCallSession
      tags: [health-assessment]
      summary: End a call session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ended session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"

  /health-assessment/sessions/{id}/data-points:
    get:
      operationId: getSessionDataPoints
      tags: [health-assessment]
      summary: Get all health data points for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthDataPoint"

  /health-assessment/summary/today:
    get:
      operationId: getTodaySummary
      tags: [health-assessment]
      summary: Get today's assessment summary grouped by category
      responses:
        "200":
          description: Today's summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSummary"

  /health-assessment/trends:
    get:
      operationId: getAssessmentTrends
      tags: [health-assessment]
      summary: Get 30-day trend data grouped by category and date
      responses:
        "200":
          description: Trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /health-assessment/anomalies:
    get:
      operationId: getAssessmentAnomalies
      tags: [health-assessment]
      summary: Get sustained anomaly categories (flagged in 3+ of last 5 sessions)
      responses:
        "200":
          description: Sustained anomalies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAnomalies"

  /health-assessment/settings:
    get:
      operationId: getAssessmentSettings
      tags: [health-assessment]
      summary: Get assessment settings (quiet window, etc.)
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSettings"
    put:
      operationId: updateAssessmentSettings
      tags: [health-assessment]
      summary: Update assessment settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSettings"

  /shopper/meals:
    get:
      operationId: listMeals
      tags: [shopper]
      summary: List all active meals with ingredients
      responses:
        "200":
          description: Array of meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealWithIngredients"
    post:
      operationId: createMeal
      tags: [shopper]
      summary: Create a new meal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealInput"
      responses:
        "201":
          description: Created meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"

  /shopper/meals/{id}:
    delete:
      operationId: deleteMeal
      tags: [shopper]
      summary: Soft-delete a meal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /shopper/sync:
    post:
      operationId: syncFromSheets
      tags: [shopper]
      summary: Import meals from a publicly-shared Google Sheet (CSV)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetsSyncInput"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetsSyncResult"

  /shopper/cart:
    get:
      operationId: getCart
      tags: [shopper]
      summary: Get or create this week's grocery cart
      responses:
        "200":
          description: Current cart with meals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartWithMeals"

  /shopper/cart/meals:
    post:
      operationId: addMealToCart
      tags: [shopper]
      summary: Add a meal to the current cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMealToCartInput"
      responses:
        "201":
          description: Added

  /shopper/cart/meals/{cartMealId}:
    delete:
      operationId: removeMealFromCart
      tags: [shopper]
      summary: Remove a meal from the current cart
      parameters:
        - name: cartMealId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /shopper/cart/approve:
    post:
      operationId: approveCart
      tags: [shopper]
      summary: Approve the current week's cart
      responses:
        "200":
          description: Approved

  /shopper/cart/dismiss:
    post:
      operationId: dismissCart
      tags: [shopper]
      summary: Dismiss the current week's cart
      responses:
        "200":
          description: Dismissed

  /shopper/cravings:
    get:
      operationId: listCravings
      tags: [shopper]
      summary: List pending meal cravings from Pops
      responses:
        "200":
          description: Array of cravings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealCraving"
    post:
      operationId: createCraving
      tags: [shopper]
      summary: Record a meal craving (from Jessica or Ray)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCravingInput"
      responses:
        "201":
          description: Created craving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealCraving"

  /shopper/cravings/{id}:
    patch:
      operationId: updateCraving
      tags: [shopper]
      summary: Update craving status (added or dismissed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCravingInput"
      responses:
        "200":
          description: Updated

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AppState:
      type: object
      properties:
        id:
          type: integer
        currentQuarter:
          type: string
          enum: [Q1, Q2, Q3, Q4]
          description: "Effective quarter - override if set, else computed from wall clock"
        computedQuarter:
          type: string
          enum: [Q1, Q2, Q3, Q4]
          description: "Always the wall-clock-computed quarter regardless of override"
        quarterOverride:
          type: string
          nullable: true
          enum: [Q1, Q2, Q3, Q4]
          description: "Manual override set by Raymo. Null means use computed quarter."
        zombieMode:
          type: boolean
          description: "True when Pops is in rest mode (high symptom days 1-5 of Haldol cycle)"
        motivationLevel:
          type: integer
          minimum: 1
          maximum: 5
        lastUpdated:
          type: string
          format: date-time
        activeMessage:
          type: string
          description: "Message shown prominently on Pops' display"
        notes:
          type: string
        currentScheduledTask:
          nullable: true
          description: "Highest-priority active task for the current quarter (by order). Null if none."
          allOf:
            - $ref: "#/components/schemas/ScheduleTask"
      required:
        - id
        - currentQuarter
        - computedQuarter
        - zombieMode
        - motivationLevel
        - lastUpdated

    UpdateAppStateInput:
      type: object
      properties:
        quarterOverride:
          type: string
          nullable: true
          enum: [Q1, Q2, Q3, Q4]
        zombieMode:
          type: boolean
        motivationLevel:
          type: integer
          minimum: 1
          maximum: 5
        activeMessage:
          type: string
          nullable: true
        notes:
          type: string

    ScheduleTask:
      type: object
      properties:
        id:
          type: integer
        quarter:
          type: string
          enum: [Q1, Q2, Q3, Q4]
        timeLabel:
          type: string
          description: "e.g. '0600', '0800-1200'"
        title:
          type: string
        description:
          type: string
        voiceScript:
          type: string
          description: "What Jessica says when initiating this task"
        isCompleted:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
        order:
          type: integer
        isActive:
          type: boolean
      required:
        - id
        - quarter
        - timeLabel
        - title
        - isCompleted
        - order
        - isActive

    CreateScheduleTaskInput:
      type: object
      properties:
        quarter:
          type: string
          enum: [Q1, Q2, Q3, Q4]
        timeLabel:
          type: string
        title:
          type: string
        description:
          type: string
